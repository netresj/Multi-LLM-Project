name: 共有スキルの検証

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  skills:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: シンボリックリンクを有効にする
        run: git config --global core.symlinks true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 検証用の依存を導入する
        run: python -m pip install -r .llm-agents/requirements.txt
      - name: 回帰テストを実行する
        run: python -m unittest discover -s .llm-agents/tests -v
      - name: リポジトリ内の登録を確認する
        run: python .llm-agents/scripts/register-skills.py --check
